name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: hdt
    attributes:
      label: HDT version
      placeholder: "e.g. 1.58.5"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Do not include tokens, cookies, credentials or private collection data.
    validations:
      required: false
